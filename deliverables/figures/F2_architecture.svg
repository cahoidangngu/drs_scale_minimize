   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="23.832" transform="rotate(-0 12.78 23.832)">F2. DREncoder: one shared encoder for queries and passages</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(75.452227 77.024523)">query q</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(47.768633 87.662445)">"what is the capital</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(62.861016 98.300367)">of California"</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(24.101758 108.938289)">(&lt;= 25 tokens train, 32 eval)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(69.440508 215.624523)">passage p</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(35.057188 226.262445)">"The capital of California</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(51.432813 236.900367)">is Sacramento ..."</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(54.182617 247.538289)">(&lt;= 180 tokens)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(221.050195 157.412523)">Shared BERT encoder</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(208.072305 168.050445)">(same weights for q and p)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(213.073906 178.688367)">tiny ... base: 2-12 layers,</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(234.59957 189.326289)">hidden 128-768</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(382.594766 162.731484)">Mean pooling</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(376.174102 173.369406)">over real tokens</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(371.492383 184.007328)">(padding masked)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(497.950234 162.599375)">Linear layer</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(504.788008 173.237297)">H -&gt; 768</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(500.107773 183.875219)">(output_fc)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(570.78 157.412523)">768-d</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(570.78 168.050445)">vector</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(570.78 178.688367)">(no L2</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(570.78 189.326289)">norm.)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="450.81" y="284.387375" transform="rotate(-0 450.81 284.387375)">score s(q,p) = &lt;f(q), f(p)&gt;  (dot product; no temperature)</text>
   </g>
