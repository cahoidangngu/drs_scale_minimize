   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="21.06" transform="rotate(-0 12.78 21.06)">F1. Experiment workflow (scaled-down)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.800469 76.322656)">MS MARCO passages</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.745 87.520469)">8,326,970 passages (file truncated)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.020781 98.718281)">train: 529,440 unique pairs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(51.769219 109.916094)">dev.small: 6,980 queries</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(300.125859 75.620789)">Pick D pairs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(259.974844 87.378492)">seeded shuffle, take first D</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(270.251719 99.136195)">D in {2,500 ... 40,000}</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(272.154844 110.893898)">(nested within a seed)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(467.687187 76.322656)">Train DREncoder (BERT + projection)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(474.659844 87.520469)">3 epochs, lr 1e-4, batch 128, bf16</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(487.354375 98.718281)">256 random negatives / step</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(511.595781 109.916094)">3 seeds: 42, 43, 44</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(508.259844 189.91975)">Evaluate final model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(485.964531 201.117562)">first 1,000 dev queries by qid</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(489.025469 212.315375)">(1,086 query-passage pairs)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(463.7325 223.513187)">100,000-passage pool, 256 negatives,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(502.277812 234.711)">5 repeats, fixed seed 1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(262.276719 201.117562)">results/*.json -&gt; results.csv</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(268.632188 212.315375)">mean ± SD over 3 seeds</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(266.412656 223.513187)">(9 distinct configurations)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.577812 195.379594)">Fit power laws</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(34.398906 206.577406)">2-param: OLS on log-log (main)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(31.962969 217.775219)">3-param: curve_fit, bound check</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(44.161406 229.251156)">leave-one-out, per-seed fits</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(53.796563 314.682492)">Figures F4-F11, tables,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(77.721797 326.440195)">reports, audit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="565.2" y="155.7792" transform="rotate(-0 565.2 155.7792)">final checkpoint (no early stopping)</text>
   </g>
  </g>
